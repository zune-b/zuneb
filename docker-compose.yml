version: "3.8"

services:
  # Python Prediction Engine
  engine:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: polymarket-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY}
      - POLYMARKET_API_SECRET=${POLYMARKET_API_SECRET}
      - POLYMARKET_PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY}
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-100}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-500}
      - TRADE_INTERVAL_MINUTES=${TRADE_INTERVAL_MINUTES:-15}
      - WEIGHT_TECHNICAL=${WEIGHT_TECHNICAL:-0.35}
      - WEIGHT_SENTIMENT=${WEIGHT_SENTIMENT:-0.25}
      - WEIGHT_MARKET_DATA=${WEIGHT_MARKET_DATA:-0.25}
      - WEIGHT_VOLATILITY=${WEIGHT_VOLATILITY:-0.15}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-0.65}
      - MIN_EDGE_THRESHOLD=${MIN_EDGE_THRESHOLD:-0.05}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - polymarket-net

  # Node.js API Gateway
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: polymarket-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - PYTHON_ENGINE_URL=http://engine:8000
      - REDIS_URL=redis://redis:6379
      - API_KEY=${API_KEY}
    depends_on:
      - engine
      - redis
    networks:
      - polymarket-net

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - polymarket-net

networks:
  polymarket-net:
    driver: bridge

volumes:
  redis-data:
